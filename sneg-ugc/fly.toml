app = "ugc-creator-keshanovi4"
primary_region = "ams"
kill_signal = "SIGTERM"
kill_timeout = "10s"

[build]
  dockerfile = "Dockerfile.fly"

[env]
  NODE_ENV = "production"
  DEMO_MODE = "false"
  PILOT_MODE = "true"
  HOST = "0.0.0.0"
  PORT = "3000"
  PUBLIC_URL = "https://ugc-creator-keshanovi4.fly.dev"
  DATABASE_PATH = "/app/data/pilot.sqlite"
  BACKUP_DIRECTORY = "/app/data/backups"
  BOT_USERNAME = "sneg_ugc_bot"
  AI_PROVIDER = "rules"
  AI_DAILY_LIMIT = "400"
  WORKER_INTERVAL_MS = "2000"
  AI_MIN_INTERVAL_MS = "5000"
  BUSINESS_TIMEZONE = "Asia/Almaty"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "15s"
    interval = "30s"
    timeout = "5s"
    method = "GET"
    path = "/healthz"

[[mounts]]
  source = "ugc_data"
  destination = "/app/data"
  initial_size = "1gb"
  snapshot_retention = 5

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "512mb"
